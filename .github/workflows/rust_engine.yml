name: rust_engine

# CI for the Rust rewrite (RUST_REWRITE_PLAN.md M0/M6).
#
# One test definition, four cells. The suites under python/restart_test are
# written once and run against both binaries (reference / rewrite) on both
# architectures (amd64 / arm64), so an engine-specific failure is a single red
# cell instead of a second copy of the test file. The format gate (both engines
# in one run) is a separate job per architecture.
#
# arm64 needs a cross-built reference, so those cells run on push / schedule /
# manual runs; pull requests stay on amd64.
on:
  push:
    paths:
      - 'rust_engine/**'
      - 'python/restart_test/**'
      - 'python/test_pysdk/**'
      - 'tools/run_restart_test.py'
      - '.github/workflows/rust_engine.yml'
  pull_request:
    paths:
      - 'rust_engine/**'
      - 'python/restart_test/**'
      - 'tools/run_restart_test.py'
      - '.github/workflows/rust_engine.yml'
  schedule:
    - cron: '0 18 * * *' # nightly: the arm64 lane
  workflow_dispatch:

concurrency:
  group: rust-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cases the rewrite cannot run yet, one pytest node id per line. Deselected
  # only on the rust cells - the reference run stays the control. Source of
  # truth: rust_engine/docs/GAPS.md section 1 (intentionally not ported);
  # delete a line here when the gap closes.
  RUST_DESELECT: |
    python/restart_test/test_cross_engine_bytes_60_storage.py::test_the_port_round_trips_through_object_storage

jobs:
  quality:
    # Gate F: formatting, lints, licenses / advisories.
    name: quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust_engine
    steps:
      - uses: actions/checkout@v6
      - name: Install the pinned toolchain
        run: |
          # rust_engine/rust-toolchain.toml is the single source of truth.
          rustup toolchain install --profile minimal
          rustup component add rustfmt clippy
      - name: Install clang, mold and libclang
        # rust_engine/.cargo/config.toml builds RocksDB with clang and links
        # with mold (`-fuse-ld=mold`), and librocksdb-sys runs bindgen, which
        # needs libclang. Without them the build fails in its first seconds
        # ("cannot find 'ld'", then "couldn't find any valid shared libraries
        # matching: ['libclang.so']").
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang mold libclang-dev
          if ! command -v ld.mold >/dev/null 2>&1; then
            sudo ln -sf "$(command -v mold)" /usr/bin/ld.mold
          fi
          # clang-sys (bindgen, for librocksdb-sys) needs libclang, and
          # LIBCLANG_PATH overrides its search - so point it at the LLVM that
          # actually ships libclang.so* (the image also carries an LLVM
          # without the dev package, and a wrong directory is fatal).
          so=$(ls /usr/lib/llvm-*/lib/libclang.so* 2>/dev/null | sort -V | tail -1)
          if [ -n "$so" ]; then
            echo "LIBCLANG_PATH=$(dirname "$so")" >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_engine
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        # Informational: the workspace has pre-existing warnings, so this is
        # reported rather than gating. Turn it into a gate once the workspace
        # is warning-free.
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: deny
        # Informational: the action runs in its own container, where the pinned
        # nightly in rust_engine/rust-toolchain.toml is not installed (it is a
        # musl image), and advisories move with the advisory DB. The licenses /
        # bans / sources result is recorded in docs/PORTING.md (Gate F).
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust_engine/Cargo.toml
          command: check --allow advisories

  unit:
    # The workspace's own tests on both architectures. The analyzer tests load
    # /usr/share/infinity/resource, so the submodule is installed first.
    name: unit (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # arm64 needs the cross-built reference / arm runners, so PRs stay on
        # amd64; push, nightly and manual runs cover both. A job-level if cannot
        # read matrix, so the axis itself is computed from the event.
        arch: ${{ github.event_name == 'pull_request' && fromJSON('["amd64"]') || fromJSON('["amd64","arm64"]') }}
    defaults:
      run:
        working-directory: rust_engine
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install the pinned toolchain
        run: rustup toolchain install --profile minimal
      - name: Install clang, mold and libclang
        # rust_engine/.cargo/config.toml builds RocksDB with clang and links
        # with mold (`-fuse-ld=mold`), and librocksdb-sys runs bindgen, which
        # needs libclang. Without them the build fails in its first seconds
        # ("cannot find 'ld'", then "couldn't find any valid shared libraries
        # matching: ['libclang.so']").
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang mold libclang-dev
          if ! command -v ld.mold >/dev/null 2>&1; then
            sudo ln -sf "$(command -v mold)" /usr/bin/ld.mold
          fi
          # clang-sys (bindgen, for librocksdb-sys) needs libclang, and
          # LIBCLANG_PATH overrides its search - so point it at the LLVM that
          # actually ships libclang.so* (the image also carries an LLVM
          # without the dev package, and a wrong directory is fatal).
          so=$(ls /usr/lib/llvm-*/lib/libclang.so* 2>/dev/null | sort -V | tail -1)
          if [ -n "$so" ]; then
            echo "LIBCLANG_PATH=$(dirname "$so")" >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust_engine
      - name: Install the analyzer resources
        run: |
          sudo mkdir -p /usr/share/infinity/resource
          sudo cp -r ../resource/. /usr/share/infinity/resource/
      - name: test
        run: cargo test --workspace
      - name: smoke
        if: matrix.arch == 'amd64'
        run: cargo run -q -p cli -- smoke /tmp/infinity-smoke
      - name: Gate A baseline (informational)
        if: matrix.arch == 'amd64'
        continue-on-error: true
        run: cargo run -q --release -p cli -- conformance ../test/sql

  build:
    # One binary per engine and architecture; every later job downloads the
    # ones it needs. The reference is built in the repo's builder images, the
    # rewrite natively on a runner of its own architecture.
    name: build (${{ matrix.engine }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.engine == 'cpp' && 'ubuntu-latest' || (matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest') }}
    strategy:
      fail-fast: false
      matrix:
        # The reference build is 40-60 minutes in a builder image and depends
        # on vcpkg's downloads, so pull requests run the rewrite alone; push,
        # nightly and manual runs build both engines.
        engine: ${{ github.event_name == 'pull_request' && fromJSON('["rust"]') || fromJSON('["cpp","rust"]') }}
        arch: ${{ github.event_name == 'pull_request' && fromJSON('["amd64"]') || fromJSON('["amd64","arm64"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # ---- rewrite -----------------------------------------------------
      - name: Install the pinned toolchain
        if: matrix.engine == 'rust'
        run: rustup toolchain install --profile minimal
      - name: Install clang, mold and libclang
        if: matrix.engine == 'rust'
        # rust_engine/.cargo/config.toml builds RocksDB with clang and links
        # with mold (`-fuse-ld=mold`); without them every build script fails
        # with "collect2: fatal error: cannot find 'ld'".
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang mold libclang-dev
          if ! command -v ld.mold >/dev/null 2>&1; then
            sudo ln -sf "$(command -v mold)" /usr/bin/ld.mold
          fi
          # clang-sys (bindgen, for librocksdb-sys) needs libclang, and
          # LIBCLANG_PATH overrides its search - so point it at the LLVM that
          # actually ships libclang.so* (the image also carries an LLVM
          # without the dev package, and a wrong directory is fatal).
          so=$(ls /usr/lib/llvm-*/lib/libclang.so* 2>/dev/null | sort -V | tail -1)
          if [ -n "$so" ]; then
            echo "LIBCLANG_PATH=$(dirname "$so")" >> "$GITHUB_ENV"
          fi
      - uses: Swatinem/rust-cache@v2
        if: matrix.engine == 'rust'
        with:
          workspaces: rust_engine
      - name: Build the rewrite
        if: matrix.engine == 'rust'
        working-directory: rust_engine
        run: cargo build --release -p cli

      # ---- reference ---------------------------------------------------
      - name: Build the reference (amd64)
        if: matrix.engine == 'cpp' && matrix.arch == 'amd64'
        run: |
          docker run --cap-add=NET_ADMIN -d --name infinity_builder \
            -v ${PWD}:/infinity -v ${PWD}/resource:/usr/share/infinity/resource \
            infiniflow/infinity-x64-x64-v2-builder:latest
          docker exec infinity_builder cp /infinity/.github/workflows/x64-x64-libstdc++.modules.json \
            /x86_64-linux-gnu/lib/gcc/x86_64-linux-gnu/15.2.0/libstdc++.modules.json
          docker exec infinity_builder cmake -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++-20 -DCMAKE_MAKE_PROGRAM=/usr/local/bin/ninja \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -S /infinity -B /infinity/cmake-build-reldeb
          docker exec infinity_builder cmake --build /infinity/cmake-build-reldeb --target infinity -j 8
      - name: Build the reference (arm64, cross-compiled)
        if: matrix.engine == 'cpp' && matrix.arch == 'arm64'
        run: |
          docker run -d --name infinity_builder \
            -v ${PWD}:/infinity -v ${PWD}/resource:/usr/share/infinity/resource \
            infiniflow/infinity-x64-arm64-builder:latest
          docker exec infinity_builder cp /infinity/.github/workflows/x64-arm64-libstdc++.modules.json \
            /x86_64-aarch64-none-linux-gnu-15.2.1/lib/gcc/aarch64-none-linux-gnu/15.2.1/libstdc++.modules.json
          docker exec infinity_builder bash -c "\
            git config --global safe.directory '*' && cd /infinity && \
            rm -rf cmake-build-reldeb && mkdir -p cmake-build-reldeb && \
            SYS_ROOT=/x86_64-aarch64-none-linux-gnu-15.2.1/aarch64-none-linux-gnu/libc/ \
            GCC_TOOLCHAIN=/x86_64-aarch64-none-linux-gnu-15.2.1/ \
            cmake -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
              -DCMAKE_TOOLCHAIN_FILE=\$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
              -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=\$PWD/cmake/toolchains/arm64-linux.cmake \
              -DVCPKG_OVERLAY_TRIPLETS=\$PWD/cmake/triplets -DVCPKG_TARGET_TRIPLET=arm64-linux \
              -DCMAKE_CXX_STDLIB_MODULES_JSON=/x86_64-aarch64-none-linux-gnu-15.2.1/lib/gcc/aarch64-none-linux-gnu/15.2.1/libstdc++.modules.json \
              -DCMAKE_BUILD_TYPE=Release -S /infinity -B /infinity/cmake-build-reldeb && \
            cmake --build /infinity/cmake-build-reldeb --target infinity -j 8"

      - name: Collect the binary
        run: |
          mkdir -p bin
          if [ "${{ matrix.engine }}" = "rust" ]; then
            cp rust_engine/target/release/infinity bin/infinity
          else
            cp cmake-build-reldeb/src/infinity bin/infinity
          fi
          chmod +x bin/infinity
          file bin/infinity
      - name: Stop the builder
        if: always() && matrix.engine == 'cpp'
        run: docker rm -f infinity_builder || true
      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.engine }}-${{ matrix.arch }}
          path: bin/infinity
          retention-days: 3

  restart:
    # Gate C: the restart / recovery suite, one definition, one binary per cell.
    name: restart (${{ matrix.engine }}, ${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # The reference build is 40-60 minutes in a builder image and depends
        # on vcpkg's downloads, so pull requests run the rewrite alone; push,
        # nightly and manual runs build both engines.
        engine: ${{ github.event_name == 'pull_request' && fromJSON('["rust"]') || fromJSON('["cpp","rust"]') }}
        arch: ${{ github.event_name == 'pull_request' && fromJSON('["amd64"]') || fromJSON('["amd64","arm64"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/download-artifact@v8
        with:
          name: bin-${{ matrix.engine }}-${{ matrix.arch }}
          path: bin
      - name: Prepare the resources and the data directory
        run: |
          chmod +x bin/infinity
          sudo mkdir -p /usr/share/infinity/resource /var/infinity
          sudo cp -r resource/. /usr/share/infinity/resource/
          sudo chown -R "${USER}" /usr/share/infinity /var/infinity
      - uses: astral-sh/setup-uv@v7
      - name: Install the SDK and the test dependencies
        run: uv sync --python 3.11 --extra test --index-url https://pypi.org/simple/
      - name: Restart suite
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          args=()
          if [ "${ENGINE}" = "rust" ]; then
            # The harness starts the engine as '<binary> --config=<toml>'; the
            # shim maps that onto the rewrite's CLI.
            export INFINITY_SERVER_BIN="${PWD}/bin/infinity"
            binary="rust_engine/scripts/infinity_rust_shim.sh"
            while IFS= read -r case; do
              if [ -n "${case}" ]; then args+=("--deselect=${case}"); fi
            done <<< "${RUST_DESELECT}"
          else
            binary="${PWD}/bin/infinity"
          fi
          .venv/bin/python -m pytest -q -m "not slow" -k "not cross_engine" \
            python/restart_test --infinity_path="${binary}" --tb=short "${args[@]}"
      - name: Engine log
        if: always()
        run: tail -n 500 restart_test_infinity.log.* 2>/dev/null || true

  sdk:
    # Gate B: the unmodified Python SDK driving the matrix engine. Nightly and
    # manual runs only - the suite is ~30 files and takes tens of minutes per
    # cell, which does not belong on every pull request.
    name: sdk (${{ matrix.engine }}, ${{ matrix.arch }})
    needs: build
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        engine: [cpp, rust]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/download-artifact@v8
        with:
          name: bin-${{ matrix.engine }}-${{ matrix.arch }}
          path: bin
      - name: Prepare the resources and the data directory
        run: |
          chmod +x bin/infinity
          sudo mkdir -p /usr/share/infinity/resource /var/infinity
          sudo cp -r resource/. /usr/share/infinity/resource/
          sudo chown -R "${USER}" /usr/share/infinity /var/infinity
      - uses: astral-sh/setup-uv@v7
      - name: Install the SDK and the test dependencies
        run: uv sync --python 3.11 --extra test --index-url https://pypi.org/simple/
      - name: Start the engine
        run: |
          # Both CLIs read the same toml (ports 23817/23820, data under
          # /var/infinity), so the matrix cell only differs by the binary.
          nohup ./bin/infinity --config=conf/infinity_conf.toml > infinity.log 2>&1 &
          ./scripts/wait_for_infinity.sh
      - name: Python SDK suite
        run: .venv/bin/python -m pytest -q python/test_pysdk -m "not complex and not slow" --tb=short
      - name: Stop the engine and show its log
        if: always()
        run: |
          pkill -f "bin/infinity --config" || true
          tail -n 200 infinity.log || true

  cross_engine:
    # Gate C's format half: both engines in one run, per architecture.
    name: format gate (${{ matrix.arch }})
    needs: build
    # The byte gate needs both engines, so it follows the reference build:
    # not on pull requests, where only the rewrite is built.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ github.event_name == 'pull_request' && fromJSON('["amd64"]') || fromJSON('["amd64","arm64"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/download-artifact@v8
        with:
          name: bin-cpp-${{ matrix.arch }}
          path: bin/cpp
      - uses: actions/download-artifact@v8
        with:
          name: bin-rust-${{ matrix.arch }}
          path: bin/rust
      - name: Prepare
        run: |
          chmod +x bin/cpp/infinity bin/rust/infinity
          sudo mkdir -p /usr/share/infinity/resource /var/infinity
          sudo cp -r resource/. /usr/share/infinity/resource/
          sudo chown -R "${USER}" /usr/share/infinity /var/infinity
          # bubblewrap gives the run its own PID namespace and a disk-backed
          # /var/infinity; install it on images that do not ship it.
          command -v bwrap >/dev/null 2>&1 || {
            sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          }
      - uses: astral-sh/setup-uv@v7
      - name: Install the SDK and the test dependencies
        run: uv sync --python 3.11 --extra test --index-url https://pypi.org/simple/
      - name: Byte and cross-read suites
        env:
          INFINITY_CPP_BIN: ${{ github.workspace }}/bin/cpp/infinity
          INFINITY_SERVER_BIN: ${{ github.workspace }}/bin/rust/infinity
        run: |
          args=()
          while IFS= read -r case; do
            if [ -n "${case}" ]; then args+=("--deselect=${case}"); fi
          done <<< "${RUST_DESELECT}"
          work="$(mktemp -d)"
          bwrap --dev-bind / / --tmpfs /var --dir /var/infinity --bind "${work}" /var/infinity \
                --unshare-pid --proc /proc -- \
                .venv/bin/python -m pytest -q python/restart_test/test_cross_engine_bytes_*.py \
                -rx "${args[@]}"
          work="$(mktemp -d)"
          bwrap --dev-bind / / --tmpfs /var --dir /var/infinity --bind "${work}" /var/infinity \
                --unshare-pid --proc /proc -- \
                .venv/bin/python -m pytest -q python/restart_test/test_cross_engine_compat.py \
                --infinity_path=rust_engine/scripts/infinity_rust_shim.sh

