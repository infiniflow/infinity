# Lefthook: the same checks at `git commit` and in CI, modelled on RAGFlow.
#
# One-time setup per clone:
#   lefthook install            # writes .git/hooks/{pre-commit,...}
#
# Local commits (default mode) run every job, let the fix-capable ones rewrite
# the staged files and stage the result again (`stage_fixed`), so what is
# committed is already formatted.
#
# CI (`.github/workflows/rust_engine.yml`, the `quality` job) runs the same
# jobs on the files a push or a pull request touched with
# `LEFTHOOK_CHECK_ONLY=1`: the fix-capable jobs only check, no file is
# modified, and a finding exits non-zero.
#
# Every `run:` block is POSIX sh: lefthook executes through /bin/sh, which is
# dash on most Linux images (no bash-only `[[ ... ]]`).
pre-commit:
  parallel: true
  jobs:
    # --- text hygiene (the tools/hooks/check_files.py checks) --------------
    - name: end-of-file-fixer
      stage_fixed: true
      run: |
        if [ "${LEFTHOOK_CHECK_ONLY:-}" = "1" ]; then
          python3 tools/hooks/check_files.py eof {staged_files}
        else
          python3 tools/hooks/check_files.py eof --fix {staged_files}
        fi
    - name: trailing-whitespace
      stage_fixed: true
      run: |
        if [ "${LEFTHOOK_CHECK_ONLY:-}" = "1" ]; then
          python3 tools/hooks/check_files.py trailing-whitespace {staged_files}
        else
          python3 tools/hooks/check_files.py trailing-whitespace --fix {staged_files}
        fi
    - name: mixed-line-ending
      stage_fixed: true
      run: |
        if [ "${LEFTHOOK_CHECK_ONLY:-}" = "1" ]; then
          python3 tools/hooks/check_files.py mixed-line-ending {staged_files}
        else
          python3 tools/hooks/check_files.py mixed-line-ending --fix {staged_files}
        fi
    - name: check-yaml
      run: python3 tools/hooks/check_files.py yaml {staged_files}
    - name: check-json
      run: python3 tools/hooks/check_files.py json {staged_files}
    - name: check-case-conflict
      run: python3 tools/hooks/check_files.py case-conflict {staged_files}
    - name: check-merge-conflict
      run: python3 tools/hooks/check_files.py merge-conflict {staged_files}

    # --- C++: clang-format-20 (AGENTS.md) ----------------------------------
    # The same exclusions as .hooks/pre-commit: vendored code and the generated
    # parser are not formatted by the project.
    - name: clang-format
      glob: "*.{c,h,hpp,cpp,cppm}"
      exclude:
        - "third_party/**"
        - "cpp/third_party/**"
        - "src/networker/third_party/**"
        - "src/parser/lexer.*"
        - "src/parser/parser.*"
        - "src/parser/search_parser.*"
        - "src/parser/expression_parser.*"
      stage_fixed: true
      run: |
        if [ "${LEFTHOOK_CHECK_ONLY:-}" = "1" ]; then
          clang-format-20 --dry-run --Werror {staged_files}
        else
          clang-format-20 -i {staged_files}
        fi

    # --- Rust: rustfmt (the rewrite's own gate, rust_engine.yml "quality") --
    - name: rustfmt
      glob: "rust_engine/**/*.rs"
      stage_fixed: true
      run: |
        if [ "${LEFTHOOK_CHECK_ONLY:-}" = "1" ]; then
          cargo fmt --manifest-path rust_engine/Cargo.toml --all -- --check
        else
          cargo fmt --manifest-path rust_engine/Cargo.toml --all
        fi

    # --- Python: ruff + ruff-format (the configuration is in pyproject.toml) --
    # `uvx` runs the project's pinned Python tooling without installing it into
    # the SDK's virtualenv; `uv` is the only package manager this repo uses.
    - name: ruff
      glob: "*.py"
      stage_fixed: true
      run: |
        if [ "${LEFTHOOK_CHECK_ONLY:-}" = "1" ]; then
          uvx ruff check {staged_files}
        else
          uvx ruff check --fix {staged_files}
        fi
    - name: ruff-format
      glob: "*.py"
      stage_fixed: true
      run: |
        if [ "${LEFTHOOK_CHECK_ONLY:-}" = "1" ]; then
          uvx ruff format --check {staged_files}
        else
          uvx ruff format {staged_files}
        fi
