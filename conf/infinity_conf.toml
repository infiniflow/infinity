[general]
version                  = "0.7.5"
time_zone                = "utc-8"

[network]
server_address           = "0.0.0.0"
postgres_port            = 5432
http_port                = 23820
client_port              = 23817
connection_pool_size     = 128

[log]
log_filename             = "infinity.log"
log_dir                  = "/var/infinity/log"
log_to_stdout            = false
log_file_max_size        = "10GB"
log_file_rotate_count    = 10

# trace/debug/info/warning/error/critical 6 log levels, default: info
log_level               = "info"

[storage]
persistence_dir         = "/var/infinity/persistence"
data_dir                = "/var/infinity/data"
catalog_dir             = "/var/infinity/catalog"
# periodically activates garbage collection:
# 0 means real-time,
# s means seconds, for example "60s", 60 seconds
# m means minutes, for example "60m", 60 minutes
# h means hours, for example "1h", 1 hour
optimize_interval        = "10s"
cleanup_interval         = "60s"
compact_interval         = "120s"
storage_type             = "local"

# dump memory index entry when it reachs the capacity
mem_index_capacity       = 65536

# S3 storage config example:
# [storage.object_storage]
# url                      = "127.0.0.1:9005"
# bucket_name              = "infinity"
# access_key               = "minioadmin"
# secret_key               = "minioadmin"
# enable_https             = false

snapshot_dir            = "/var/infinity/snapshots"

[buffer]
buffer_manager_size      = "4GB"
lru_num                  = 7
temp_dir                 = "/var/infinity/tmp"
result_cache             = "off"
memindex_memory_quota    = "1GB"
# Periodic reclaim of memory that is not on disk yet (buffer + index tails):
# tables nobody writes any more would otherwise hold it until the process ends.
# One cadence serves both goals: every interval the loop reads the byte ledger
# once and either drains down to the soft waterline or sweeps tables idle past
# `unsealed_idle_age`.
# unsealed_reclaim_interval: the loop's period; "0s" disables the whole path.
# unsealed_idle_age:        how long a table must be idle to count as stale;
#                           "0s" means "no age threshold" (everything is stale).
#                           Also the base of the failure backoff.
# unsealed_max_tables_per_round: how many tables one round may dump; 0 = no limit.
unsealed_reclaim_interval     = "30s"
unsealed_idle_age             = "600s"
unsealed_max_tables_per_round = 100

[wal]
wal_dir                       = "/var/infinity/wal"
checkpoint_interval      = "86400s"
wal_compact_threshold         = "1GB"

# flush_at_once: write and flush log each commit
# only_write: write log, OS control when to flush the log, default
# flush_per_second: logs are written after each commit and flushed to disk per second.
wal_flush                     = "only_write"

[resource]
resource_dir                  = "/usr/share/infinity/resource"
