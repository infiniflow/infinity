[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/storage",
    "crates/catalog",
    "crates/txn",
    "crates/parser",
    "crates/expression",
    "crates/analyzer",
    "crates/analyzer-ffi",
    "crates/planner",
    "crates/index",
    "crates/executor",
    "crates/server",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# A compiler warning is a defect: every crate inherits this with
# `[lints] workspace = true`, so `cargo build` / `cargo test` (and every CI
# job that compiles the workspace) fails on one. A warning a crate genuinely
# cannot fix is allowed at the site with `#[allow(..., reason = "...")]`, never
# silently in the manifest.
[workspace.lints.rust]
warnings = "deny"

[workspace.dependencies]
rust-stemmers = "1.2"
tokio = { version = "1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "io-util",
    # `#[tokio::test]`: the engine's writes are async now, so a test that
    # compacts or checkpoints drives them with `.await` instead of a
    # synchronous bridge.
    "macros",
    # `tokio::fs::*`: the server's `SHOW` handlers stat the block mirror; the
    # async form keeps the reactor thread out of the syscall.
    "fs",
] }
common = { path = "crates/common" }
storage = { path = "crates/storage" }
catalog = { path = "crates/catalog" }
txn = { path = "crates/txn" }
parser = { path = "crates/parser" }
expression = { path = "crates/expression" }
analyzer = { path = "crates/analyzer" }
planner = { path = "crates/planner" }
index = { path = "crates/index" }
executor = { path = "crates/executor" }
server = { path = "crates/server" }
lz4_flex = "0.13"
mimalloc = "0.1"
arrow-array = "56"
arrow-buffer = "56"
arrow-schema = "56"
parquet = { version = "56", default-features = false, features = ["arrow", "snap", "flate2-rust_backened", "zstd", "lz4", "brotli"] }
hmac = "0.12"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
memmap2 = "0.9"
thiserror = "1"
tempfile = "3"
roaring = "0.11"
serde = "1"
serde_json = "1"

# The fork carries two patches needed by the generated Thrift service (A3):
# the parser accepts the IDL's reference fields ("&") and the protocols bound
# container sizes before the generated decode reserves a Vec for them.
[patch.crates-io]
pilota = { git = "https://github.com/yuzhichang/pilota", branch = "fix/thrift-reference-field" }
pilota-thrift-parser = { git = "https://github.com/yuzhichang/pilota", branch = "fix/thrift-reference-field" }

# `crc32fast` compiles an AVX-512 path (`calculate_avx512`) behind
# `#[target_feature(enable = "avx512f")]`, which lands in the binary whatever
# `target-cpu` says: measured, 52 `zmm` instructions when building for
# `x86-64-v3` and 26 for `x86-64-v2`. A binary that carries instructions its CPU
# rejects dies with SIGILL before it can log anything, and a crate-level flag
# cannot remove a `#[target_feature]` function.
#
# It arrives through `parquet -> flate2` as well as directly, so patching is the
# only way to keep AVX2 in the rest of the build without carrying that path. The
# stand-in is the same slicing-by-8 CRC with no SIMD.
#
# This is not what the Xeon SIGILL turned out to be - that was an `insertq` in
# RocksDB built with `-march=native`, fixed by the CI's `CXXFLAGS`. The patch
# stays because the hazard it removes is real on its own.
crc32fast = { path = "crates/crc32fast-shim" }
