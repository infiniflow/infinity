[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
# Two binaries share this package: the engine CLI is the default.
default-run = "infinity"

[[bin]]
name = "infinity"
path = "src/main.rs"

# Benchmark corpus generator (docs/FULLTEXT_BENCH.md): a build-time tool, not
# part of the server.
[[bin]]
name = "gen-corpus"
path = "src/bin/gen_corpus.rs"

[dependencies]
common.workspace = true
storage.workspace = true
catalog.workspace = true
txn.workspace = true
parser.workspace = true
executor.workspace = true
server.workspace = true
# The `.slt` parser and validator the reference's own runner is built from; the
# conformance command drives the engine through it, so there is one
# implementation of the format, not two.
# The allocator is declared in `common` and inherited by `infinity` and the
# helpers that reference it. `gen-corpus` is std-only, so it never pulls
# `common` in; it declares the same allocator itself.
mimalloc.workspace = true
sqllogictest = "0.29.1"

[lints]
workspace = true
