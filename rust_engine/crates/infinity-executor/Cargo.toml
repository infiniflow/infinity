[package]
name = "infinity-executor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rust-stemmers.workspace = true
infinity-common.workspace = true
infinity-storage.workspace = true
infinity-catalog.workspace = true
infinity-txn.workspace = true
infinity-parser.workspace = true
infinity-expression.workspace = true
infinity-planner.workspace = true
infinity-index.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[features]
default = []
# Run the engine's MetaStore on RocksDB (C++-compatible catalog substrate,
# plan §2.6.1 item 4) instead of the pure-Rust fjall store.
rocksdb-store = ["infinity-storage/rocksdb-store"]

[dev-dependencies]
tempfile.workspace = true
