[package]
name = "infinity-storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
infinity-common.workspace = true
fjall.workspace = true
lz4_flex.workspace = true
hmac.workspace = true
sha2.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
crc32fast.workspace = true
memmap2.workspace = true
# Optional RocksDB substrate for C++-compatible catalog KV (plan §2.6.1 item 4).
# Off by default so the default build stays pure-Rust and fast; enable with
# `--features rocksdb-store`.
rocksdb = { version = "0.25", optional = true, default-features = false }

[features]
default = []
rocksdb-store = ["dep:rocksdb"]

[dev-dependencies]
tempfile.workspace = true
