# The bundled RocksDB in `librocksdb-sys` is old enough that the local GCC 16
# cannot compile it, so build it with clang (23), which can.
# (`ROCKSDB_LIB_DIR`/`ROCKSDB_INCLUDE_DIR` would link the system RocksDB 10.2
# instead, but its headers no longer match the crate's FFI - see the plan.)
[env]
CC = "clang"
CXX = "clang++"

# Link with mold. A full link of this workspace is dominated by the ~40 MB
# binary plus the static RocksDB, and mold does that several times faster than
# the system `ld` without changing the output.
#
# `target-cpu=x86-64-v3` is the AVX2 baseline (Haswell, 2013). Without it the
# default `x86-64` target has only SSE2, and `std::simd`'s `f32x8` is split into
# two 128-bit halves: the exact scan's `l2_sq` came out as `subps`/`mulps`/
# `addps` with no `ymm` register at all. With v3 the same kernel is one
# `vsubps`/`vmulps`/`vaddps` over 256 bits, which took the SIFT 1M brute-force
# scan from 39.4 to 34.9 ms p50. `native` measures the same on this box; v3 is
# chosen because a released binary has to run on machines other than the one
# that built it.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold", "-C", "target-cpu=x86-64-v3"]
